services:
  - type: web
    name: campuslink-api
    runtime: node
    plan: free
    rootDir: backend/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated list of allowed frontend origins (CORS + Socket.io),
      # e.g. https://campuslink.vercel.app,https://www.campuslink.app
      - key: CLIENT_URL
        sync: false
